<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关卡设计器 — 魂斗罗·布娃娃</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e16; overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #f0e6d2; }
    #cv { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    .bar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 8px; background: rgba(16, 20, 32, 0.92);
      border: 1px solid rgba(244,233,216,0.25); border-radius: 14px; padding: 8px 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .bar .title { font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif; font-size: 16px;
      letter-spacing: 3px; color: #ffb14a; margin-right: 6px; }
    .bar button {
      background: rgba(244,233,216,0.08); border: 1px solid rgba(244,233,216,0.25);
      color: #f0e6d2; border-radius: 9px; padding: 6px 14px; font-size: 12.5px; cursor: pointer;
    }
    .bar button:hover { border-color: rgba(232,160,76,0.8); }
    .bar button.on { background: rgba(232,160,76,0.9); color: #241a08; border-color: #e8a04c; font-weight: 700; }
    .bar .sep { width: 1px; height: 20px; background: rgba(244,233,216,0.2); }
    .tip { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
      font-size: 11.5px; opacity: 0.55; background: rgba(10,14,24,0.7); border-radius: 999px; padding: 4px 16px; }
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: rgba(232,160,76,0.92); color: #241a08; padding: 6px 18px; border-radius: 999px;
      font-size: 12.5px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div class="bar">
    <span class="title">关卡设计器</span>
    <button id="tPlat" class="on"><span class="dot" style="background:#7a6446"></span>平台</button>
    <button id="tBlock"><span class="dot" style="background:#8a4a3a"></span>箱块</button>
    <button id="tErase"><span class="dot" style="background:#e0523c"></span>擦除</button>
    <span class="sep"></span>
    <button id="bClear">清空</button>
    <button id="bSave">保存</button>
    <button id="bPlay" style="background:rgba(232,160,76,0.9); color:#241a08; border-color:#e8a04c; font-weight:700">试玩 ▶</button>
    <span class="sep"></span>
    <a href="./game.html" style="text-decoration:none; color:#f0e6d2; font-size:12px; opacity:0.7">← 游戏主菜单</a>
  </div>
  <div class="tip">左键拖拽画块(0.5m 网格吸附)· 擦除模式或按住右键删除 · 绿色草头是固定地表,打不烂;你画的块都可以被子弹打碎</div>
  <div id="toast"></div>
  <script type="module" src="/src/designer/levelEditor.js"></script>
</body>
</html>
