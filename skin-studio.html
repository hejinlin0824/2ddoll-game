<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮肤工坊 — Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e16; overflow: hidden;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #f0e6d2; }
    .bar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 8px; background: rgba(16,20,32,0.92);
      border: 1px solid rgba(244,233,216,0.25); border-radius: 14px; padding: 8px 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .bar .title { font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif; font-size: 16px;
      letter-spacing: 3px; color: #ffb14a; margin-right: 6px; }
    .bar button { background: rgba(244,233,216,0.08); border: 1px solid rgba(244,233,216,0.25);
      color: #f0e6d2; border-radius: 9px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
    .bar button:hover { border-color: rgba(232,160,76,0.8); }
    .bar .primary { background: rgba(232,160,76,0.9); color: #241a08; border-color: #e8a04c; font-weight: 700; }
    .bar label { font-size: 12px; opacity: 0.8; display: flex; align-items: center; gap: 5px; }
    .bar input[type=range] { width: 110px; }
    .bar .sep { width: 1px; height: 20px; background: rgba(244,233,216,0.2); }
    .bar a { text-decoration: none; color: #f0e6d2; font-size: 12px; opacity: 0.7; }
    #wrap { display: flex; gap: 18px; padding: 76px 20px 16px; height: 100%; box-sizing: border-box; }
    #slots { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; overflow-y: auto; }
    .slot { background: rgba(16,20,32,0.85); border: 1px solid rgba(244,233,216,0.18); border-radius: 12px; padding: 10px; }
    .slot .name { font-size: 13px; font-weight: 700; color: #ffb14a; margin-bottom: 2px; }
    .slot .hint { font-size: 10.5px; opacity: 0.55; margin-bottom: 7px; line-height: 1.45; }
    .slot .pv { width: 100%; height: 110px; border-radius: 8px;
      background: repeating-conic-gradient(#2a2f3d 0% 25%, #1c212c 0% 50%) 0 0 / 16px 16px; }
    .slot .btns { display: flex; gap: 6px; margin-top: 8px; }
    .slot button { flex: 1; background: rgba(244,233,216,0.08); border: 1px solid rgba(244,233,216,0.25);
      color: #f0e6d2; border-radius: 7px; padding: 5px 4px; font-size: 11.5px; cursor: pointer; }
    .slot button:hover { border-color: rgba(232,160,76,0.8); }
    .slot button.del { flex: 0 0 58px; }
    #right { width: 330px; display: flex; flex-direction: column; gap: 10px; }
    #assembled { background: linear-gradient(#1a2338, #0b0e16); border: 1px solid rgba(244,233,216,0.18); border-radius: 12px; }
    #guide { background: rgba(16,20,32,0.85); border: 1px solid rgba(244,233,216,0.18); border-radius: 12px;
      padding: 10px 12px; font-size: 11.5px; line-height: 1.7; opacity: 0.85; }
    #guide b { color: #ffb14a; }
    #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 8;
      background: rgba(232,160,76,0.92); color: #241a08; padding: 6px 18px; border-radius: 999px;
      font-size: 12.5px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .tag { font-size: 10px; font-weight: 400; color: #8fc7ff; margin-left: 6px; }
    #modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
      background: rgba(4,6,12,0.72); backdrop-filter: blur(3px); }
    .mcard { background: rgba(16,20,32,0.97); border: 1px solid rgba(244,233,216,0.25); border-radius: 14px;
      padding: 14px; box-shadow: 0 20px 70px rgba(0,0,0,0.6); }
    .mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .mhead span { font-weight: 700; color: #ffb14a; font-size: 14px; }
    .mhead button { background: none; border: 1px solid rgba(244,233,216,0.25); color: #f0e6d2;
      border-radius: 7px; width: 26px; height: 26px; cursor: pointer; }
    #mCv { background: repeating-conic-gradient(#2a2f3d 0% 25%, #1c212c 0% 50%) 0 0 / 20px 20px;
      border-radius: 10px; cursor: crosshair; touch-action: none; max-width: 62vw; max-height: 60vh; }
    .mtools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .mtools button { background: rgba(244,233,216,0.08); border: 1px solid rgba(244,233,216,0.25);
      color: #f0e6d2; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .mtools button.on { background: rgba(232,160,76,0.9); color: #241a08; font-weight: 700; }
    .mtools .primary { background: rgba(232,160,76,0.9); color: #241a08; border-color: #e8a04c; font-weight: 700; }
    .mtools label { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    #mHint { margin-top: 8px; font-size: 11.5px; opacity: 0.7; line-height: 1.5; max-width: 460px; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">皮肤工坊</span>
    <label>白底容差 <input type="range" id="tol" min="10" max="80" value="34"> <span id="tolV">34</span></label>
    <label><input type="checkbox" id="keepInner" checked> 保留内部白</label>
    <span class="sep"></span>
    <button id="bSave">保存</button>
    <button id="bPlay" class="primary">试玩 ▶</button>
    <button id="bClearAll">全部清除</button>
    <span class="sep"></span>
    <a href="./game.html">← 游戏主菜单</a>
  </div>
  <div id="wrap">
    <div id="slots"></div>
    <div id="right">
      <canvas id="assembled" width="330" height="380"></canvas>
      <div id="guide">
        <b>画法要求(很重要)</b><br>
        · 白纸/白底画,拍照片或截图都行,上传后自动抠掉白底、裁掉空白边,再用「标记上下端」转正<br>
        · <b>四肢竖着画:上端 = 肩(髋),下端 = 手(脚)</b>,<b>画多长游戏里就多长</b>(按长度适配,粗细随你的素材);
        头和躯干画正面或朝右侧面(转向自动镜像)<br>
        · 部件之间游戏里自动搭接(头/躯干/关节处互相伸进去一点),不会露缝;想画脖子/腰带就画在躯干素材的上下端<br>
        · 上屏很小(全身约 81px):<b>笔画要粗、颜色要亮</b>,细线细节会被缩小吃掉<br>
        · 头盔/防弹衣只在真的穿着对应护甲时显示;少画哪件就自动用回程序绘制的那件
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="modal">
    <div class="mcard">
      <div class="mhead"><span id="mTitle"></span><button id="mClose">✕</button></div>
      <canvas id="mCv" width="460" height="440"></canvas>
      <div class="mtools">
        <button id="mMark" class="on">① 标记上下端</button>
        <button id="mDrag">② 拖动微调</button>
        <label>缩放 <input type="range" id="mScale" min="40" max="220" value="100"> <span id="mScaleV">1.00×</span></label>
        <button id="mReset">重置变换</button>
        <button id="mOk" class="primary">确认 ✓</button>
      </div>
      <div id="mHint"></div>
    </div>
  </div>
  <script type="module" src="/src/designer/skinStudio.js"></script>
</body>
</html>
