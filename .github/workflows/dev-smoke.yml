name: Dev smoke checks

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Report main baseline and verify protected tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          actual_main="$(git rev-parse FETCH_HEAD)"
          expected_main="dbbae29b41d63e18265c057f54f9488f659ec70a"
          echo "main FETCH_HEAD=$actual_main"
          if [ "$actual_main" = "$expected_main" ]; then
            echo "PASS: main remains at the recorded baseline."
          else
            echo "::warning::main moved from the recorded baseline (expected $expected_main, found $actual_main); continuing dev-only smoke tests without changing main."
          fi
          actual_tag="$(git ls-remote origin refs/tags/v0.5.0 | awk '{print $1}')"
          expected_tag="d9c6b7f2a81fb5d65bc8a332b4cd7ce4e8178694"
          echo "v0.5.0 ref=$actual_tag"
          test "$actual_tag" = "$expected_tag" || { echo "v0.5.0 tag ref moved"; exit 1; }
          echo "PASS: protected v0.5.0 tag ref unchanged; proceeding with dev smoke tests."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Install temporary browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Vite and validate game.html console
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 5199 > vite-smoke.log 2>&1 &
          VITE_PID=$!
          cleanup() {
            kill "$VITE_PID" 2>/dev/null || true
            if [ -f vite-smoke.log ]; then cat vite-smoke.log; fi
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5199/game.html >/dev/null; then
              break
            fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then
              echo "npx vite exited before serving game.html"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5199/game.html >/dev/null
          node tests/browser-smoke.mjs
